<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Semin Öztürk Şener - Türkiye'nin İlk Profesyonel Kadın Akrobasi Pilotu" />
    <title>Semin Öztürk Şener - Professional Aerobatic Pilot</title>
    <!-- Site ikonu: logodaki uçak (SVG), desteklemeyen tarayıcılar için PNG -->
    <link rel="icon" type="image/svg+xml" href="/images/logo/semin-ucak.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font sayfayı bekletmesin: yavaş ağda önce yedek font, Lexend gelince değişir -->
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    </noscript>
    <style>
      body {
        font-family: "Lexend", sans-serif;
        background: #f4f1ec;
      }
      .text-glow {
        text-shadow: 0 0 20px rgba(224, 47, 60, 0.5);
      }
      .text-stroke {
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.1);
        color: transparent;
      }
      /* Lenis smooth scroll */
      html.lenis,
      html.lenis body {
        height: auto;
      }
      .lenis.lenis-smooth {
        scroll-behavior: auto !important;
      }
      .lenis.lenis-smooth [data-lenis-prevent] {
        overscroll-behavior: contain;
      }
      .lenis.lenis-stopped {
        overflow: hidden;
      }
      /* Lenis aktifken anchor jump'ları için */
      html:not(.lenis) {
        scroll-behavior: smooth;
      }
      /* Scroll ile belirme (reveal) — sert, vuruşlu giriş (expo-out) */
      [data-reveal] {
        opacity: 0;
        transform: translateY(70px) skewY(2.5deg);
        transform-origin: left top;
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
          transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform;
      }
      [data-reveal].reveal-in {
        opacity: 1;
        transform: none;
      }
      [data-reveal-delay="1"] { transition-delay: 0.06s; }
      [data-reveal-delay="2"] { transition-delay: 0.12s; }
      [data-reveal-delay="3"] { transition-delay: 0.18s; }
      [data-reveal-delay="4"] { transition-delay: 0.24s; }
      [data-reveal-delay="5"] { transition-delay: 0.3s; }
      /* Başlıktaki kırmızı çubuk hızla yukarı fırlar */
      [data-reveal] .reveal-bar {
        transform: skewX(-15deg) scaleY(0);
        transform-origin: bottom;
        transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.15s;
      }
      [data-reveal].reveal-in .reveal-bar {
        transform: skewX(-15deg) scaleY(1);
      }
      /* Görsel "ekrana akar" reveal: alttan açılma + zoom-out */
      [data-reveal-img] {
        clip-path: inset(0 0 100% 0);
        transition: clip-path 1.1s cubic-bezier(0.77, 0, 0.18, 1);
        will-change: clip-path;
      }
      [data-reveal-img].reveal-in {
        clip-path: inset(0 0 0 0);
      }
      [data-reveal-img] img {
        transform: scale(1.35);
        transition: transform 1.6s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: transform;
      }
      [data-reveal-img].reveal-in img {
        transform: scale(1);
      }
      @media (prefers-reduced-motion: reduce) {
        [data-reveal],
        [data-reveal-img],
        [data-reveal-img] img,
        [data-reveal] .reveal-bar {
          opacity: 1 !important;
          transform: none !important;
          clip-path: none !important;
          transition: none !important;
        }
      }
      /* Kariyer sahnesi (mobil): kenar boşluğu metinle aynı; fotoğraf kısa ekranlarda küçülür */
      .career-stage { --pad: 24px; --top: max(12svh, 96px); --pw: min(calc(100vw - 2 * var(--pad)), 42svh); }
      @media (min-width: 640px) { .career-stage { --pad: 36px; } }
      /* Kariyer sahnesi: dönüm noktası metni vuruşla girer */
      @keyframes slamIn {
        0% { opacity: 0; transform: translateX(-60px) skewX(-12deg); }
        100% { opacity: 1; transform: none; }
      }
      .slam-in { animation: slamIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .slam-in-2 { animation-delay: 0.08s; }
      .slam-in-3 { animation-delay: 0.16s; }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(11, 11, 13, 0.25);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(11, 11, 13, 0.45);
      }
      /* Focus visible styles */
      *:focus-visible {
        outline: 2px solid #E02F3C;
        outline-offset: 2px;
      }
      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
      /* Scroll animation helper */
      .animate-on-scroll {
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      }
      .animate-on-scroll.visible {
        opacity: 1;
        transform: translateY(0);
      }
      /* Stagger delay classes */
      .stagger-1 { transition-delay: 0.1s; }
      .stagger-2 { transition-delay: 0.2s; }
      .stagger-3 { transition-delay: 0.3s; }
      .stagger-4 { transition-delay: 0.4s; }
      .stagger-5 { transition-delay: 0.5s; }
    </style>
  </head>
  <body class="bg-paper text-ink overflow-x-hidden">
    <div id="root"></div>
    <!--
      Açılış bekçisi: JS paketi yüklenemez ya da çalışamazsa (deploy sonrası eski önbellek, ağ kesintisi,
      desteklenmeyen tarayıcı) sayfa bembeyaz kalmasın. Bir kez yenilemeyi dener; olmazsa kısa bir mesaj gösterir.
      Bilerek eski usul JS: en eski tarayıcılarda da çalışmalı.
    -->
    <script>
      (function () {
        var KEY = "boot-retry";
        var root = document.getElementById("root");
        function get() { try { return Number(sessionStorage.getItem(KEY)) || 0; } catch (e) { return -1; } }
        function set(v) { try { v ? sessionStorage.setItem(KEY, v) : sessionStorage.removeItem(KEY); } catch (e) {} }
        function show() {
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font-family:sans-serif;color:#0b0b0d">' +
            '<p style="font-size:18px;font-weight:700;margin:0">Sayfa yüklenemedi.</p>' +
            '<p style="margin:0;opacity:.7">Bağlantınızı kontrol edip sayfayı yenileyin. Sorun sürerse tarayıcınızı güncelleyin.</p>' +
            '<button type="button" onclick="location.reload()" style="background:#E02F3C;color:#fff;border:0;padding:12px 24px;font-weight:700;text-transform:uppercase">Yenile</button>' +
            "</div>";
        }
        function check() {
          if (root.childElementCount) return set(0);
          var last = get();
          // Son 30 sn içinde zaten yenilediysek (ya da sessionStorage yoksa) döngüye girme, mesajı göster
          if (last === -1 || Date.now() - last < 30000) return show();
          set(String(Date.now()));
          location.reload();
        }
        document.addEventListener("DOMContentLoaded", function () { setTimeout(check, 4000); });
      })();
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
