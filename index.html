<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Semin Öztürk Şener - Türkiye'nin İlk Profesyonel Kadın Akrobasi Pilotu" />
    <title>Semin Öztürk Şener - Professional Aerobatic Pilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#E02F3C",
              "background-light": "#f4f1ec",
              "background-dark": "#0b0b0d",
              "surface-dark": "#0b0b0d",
              ink: "#0b0b0d",
              paper: "#f4f1ec",
            },
            fontFamily: {
              display: ["Lexend", "sans-serif"],
              sans: ["Lexend", "sans-serif"],
            },
            animation: {
              "pulse-slow": "pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite",
              "fade-in-up": "fadeInUp 0.6s ease-out forwards",
              "fade-in-down": "fadeInDown 0.6s ease-out forwards",
              "fade-in": "fadeIn 0.5s ease-out forwards",
              "slide-in-right": "slideInRight 0.3s ease-out forwards",
              "slide-in-left": "slideInLeft 0.3s ease-out forwards",
              shimmer: "shimmer 1.5s infinite",
              "scale-in": "scaleIn 0.3s ease-out forwards",
              float: "float 3s ease-in-out infinite",
            },
            keyframes: {
              fadeInUp: {
                "0%": { opacity: "0", transform: "translateY(30px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
              fadeInDown: {
                "0%": { opacity: "0", transform: "translateY(-30px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
              fadeIn: {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" },
              },
              slideInRight: {
                "0%": { opacity: "0", transform: "translateX(30px)" },
                "100%": { opacity: "1", transform: "translateX(0)" },
              },
              slideInLeft: {
                "0%": { opacity: "0", transform: "translateX(-30px)" },
                "100%": { opacity: "1", transform: "translateX(0)" },
              },
              shimmer: {
                "0%": { transform: "translateX(-100%)" },
                "100%": { transform: "translateX(100%)" },
              },
              scaleIn: {
                "0%": { opacity: "0", transform: "scale(0.9)" },
                "100%": { opacity: "1", transform: "scale(1)" },
              },
              float: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-10px)" },
              },
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Lexend", sans-serif;
        background: #f4f1ec;
      }
      .text-glow {
        text-shadow: 0 0 20px rgba(224, 47, 60, 0.5);
      }
      .text-stroke {
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.1);
        color: transparent;
      }
      /* Lenis smooth scroll */
      html.lenis,
      html.lenis body {
        height: auto;
      }
      .lenis.lenis-smooth {
        scroll-behavior: auto !important;
      }
      .lenis.lenis-smooth [data-lenis-prevent] {
        overscroll-behavior: contain;
      }
      .lenis.lenis-stopped {
        overflow: hidden;
      }
      /* Lenis aktifken anchor jump'ları için */
      html:not(.lenis) {
        scroll-behavior: smooth;
      }
      /* Scroll ile belirme (reveal) — sert, vuruşlu giriş (expo-out) */
      [data-reveal] {
        opacity: 0;
        transform: translateY(70px) skewY(2.5deg);
        transform-origin: left top;
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
          transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform;
      }
      [data-reveal].reveal-in {
        opacity: 1;
        transform: none;
      }
      [data-reveal-delay="1"] { transition-delay: 0.06s; }
      [data-reveal-delay="2"] { transition-delay: 0.12s; }
      [data-reveal-delay="3"] { transition-delay: 0.18s; }
      [data-reveal-delay="4"] { transition-delay: 0.24s; }
      [data-reveal-delay="5"] { transition-delay: 0.3s; }
      /* Başlıktaki kırmızı çubuk hızla yukarı fırlar */
      [data-reveal] .reveal-bar {
        transform: skewX(-15deg) scaleY(0);
        transform-origin: bottom;
        transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.15s;
      }
      [data-reveal].reveal-in .reveal-bar {
        transform: skewX(-15deg) scaleY(1);
      }
      /* Görsel "ekrana akar" reveal: alttan açılma + zoom-out */
      [data-reveal-img] {
        clip-path: inset(0 0 100% 0);
        transition: clip-path 1.1s cubic-bezier(0.77, 0, 0.18, 1);
        will-change: clip-path;
      }
      [data-reveal-img].reveal-in {
        clip-path: inset(0 0 0 0);
      }
      [data-reveal-img] img {
        transform: scale(1.35);
        transition: transform 1.6s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: transform;
      }
      [data-reveal-img].reveal-in img {
        transform: scale(1);
      }
      @media (prefers-reduced-motion: reduce) {
        [data-reveal],
        [data-reveal-img],
        [data-reveal-img] img,
        [data-reveal] .reveal-bar {
          opacity: 1 !important;
          transform: none !important;
          clip-path: none !important;
          transition: none !important;
        }
      }
      /* Kariyer sahnesi: dönüm noktası metni vuruşla girer */
      @keyframes slamIn {
        0% { opacity: 0; transform: translateX(-60px) skewX(-12deg); }
        100% { opacity: 1; transform: none; }
      }
      .slam-in { animation: slamIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .slam-in-2 { animation-delay: 0.08s; }
      .slam-in-3 { animation-delay: 0.16s; }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(11, 11, 13, 0.25);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(11, 11, 13, 0.45);
      }
      /* Focus visible styles */
      *:focus-visible {
        outline: 2px solid #E02F3C;
        outline-offset: 2px;
      }
      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
      /* Scroll animation helper */
      .animate-on-scroll {
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      }
      .animate-on-scroll.visible {
        opacity: 1;
        transform: translateY(0);
      }
      /* Stagger delay classes */
      .stagger-1 { transition-delay: 0.1s; }
      .stagger-2 { transition-delay: 0.2s; }
      .stagger-3 { transition-delay: 0.3s; }
      .stagger-4 { transition-delay: 0.4s; }
      .stagger-5 { transition-delay: 0.5s; }
    </style>
  </head>
  <body class="bg-paper text-ink overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
